 ### Ideas ###
 VEN_the_shadow_of_gomez:0 "The Shadow of Gómez"
 VEN_the_shadow_of_gomez_desc:0 "Decades of dictatorship have left Venezuela's political institutions weak and its society accustomed to personal rule. Chalbaud has inherited the machinery of the old regime, but not its legitimacy."
 VEN_big_three:0 "Oil Enclave"
 VEN_big_three_desc:0 "Venezuela is a land filled with natural resources, with Caracas brimming with oil off the shores and coasts of this great and prosperous nation. However, due to the discovery of such reserves, foreign interest groups, especially British and Rockefeller funded liasons have had a triopoly consolidate and wither down the 100 companies that had originally sent drilling missions to the lake of Maracaibo; Shell, Gulf, and Creole Oil. If we are to dare challenge this status quo gain economic independence, we will for sure be risking our political security, which is why this blatant robbing of our nation's resources has continued for so long."
 
