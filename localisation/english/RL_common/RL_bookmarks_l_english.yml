 ### Bookmarks ###
 BREAD_AND_ROSES_NAME:0 "Bread and Roses"
 BREAD_AND_ROSES_DESC:0 "As the Great War laid bare the contradictions of the capitalist world order, Socialism, once deemed degenerate and seditionist thought has become commonplace. Even the United States, that bastion of the free market, now stands firmly under the Presidency of Norman Thomas, leader of the Socialist Party of America. The world is a far different place than the one dreamed about at the beginning of the century - will you aid the revolution of the common man, achieving equality for all? Or will you strike it down in the name of individual freedom and finance, striving for a world of the renewed American Dream?"
 
 USA_BREAD_AND_ROSES_DESC:0 "Thanks to the shrewd policies of the former President Debs, not only did America manage to stay out of the mess that was the Great War, but it also was the mediator of the resulting peace. Now, despite those efforts, the fraying concert of Europe threatens to disturb the burgeoning republic once again. The coming storm may be one that the country cannot avoid. Though the wounds of the depression are still fresh, many Americans feel that the worst is behind them. They revere Norman Thomas, the 'modern day Debs', and his socialist party. Only time will tell if their loyalty to the president is deserved."
 FRA_BREAD_AND_ROSES_DESC:0 "The years have not been kind to France. Beaten, but not defeated, she limped along after the end of the Great War, only holding together thanks to the exhaustion seeping into every facet of life. Now, dark clouds once again grow on the horizon; radicalism that once laid dormant agitates once more, threatening to bring down the cherished republic. The next war will not be fought for honor, but for survival. France will need to summon every ounce of her strength to make it through the coming storm. But is she ready?"
 SOV_BREAD_AND_ROSES_DESC:0 "The October Revolution annihilated the Rusian Empire, ending 1000 years of Tsarist despotism. Or did it?"
 